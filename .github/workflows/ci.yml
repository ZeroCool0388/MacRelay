name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select Swift 6 on macOS 14
        if: matrix.os == 'macos-14'
        run: |
          test -d /Applications/Xcode_16.2.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Check Swift tools
        run: swift --version
      - name: Test
        run: ./scripts/test.sh
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Package development build
        run: ditto -c -k --keepParent build/MacRelay.app build/MacRelay-${{ matrix.os }}.zip
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: MacRelay-${{ matrix.os }}-development
          path: build/MacRelay-${{ matrix.os }}.zip
          retention-days: 14
